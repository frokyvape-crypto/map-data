old;color:#1a252f;margin-bottom:2px}.ca{font-size:11px;color:#888}@media(max-width:480px){#topbar h1{display:none}}</style></head><body><div id="topbar"><h1>담배소매인</h1><input type="text" id="srch" placeholder="주소 또는 장소 검색..." onkeydown="if(event.key==='Enter')mv()"><button id="mvBtn" onclick="mv()">위치이동</button><span id="stats">불러오는 중...</span></div><div id="map"></div><div id="lmsg">지도 불러오는 중...</div><div id="cpanel"><div id="chdr"><span id="ctitle">검색 결과</span><button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer" onclick="document.getElementById('cpanel').style.display='none'">✕</button></div><div id="clist"></div></div><div id="badge">📍담배소매인 지도 | 5/20/2026 | 핀 133,836 / 전체 136,573개</div><script>var K='8ec558dec4eb0d751784b4e7ee3fca08',GC=null,map,gc,ap=[],am=[],ao=[],rp=false,ir=false,oiw=null;var GS=[0,0,0,0,0,0,0,0,0.05,0.1,0.2,0.4,0.8,1.6,3.2];function sl(m){var e=document.getElementById('lmsg');e.innerHTML=m;e.style.display='block'}function hl(){document.getElementById('lmsg').style.display='none'}window.onerror=function(msg,src,line,col,err){sl('❌ JS오류: '+msg+'\n'+src+':'+line);return false;};window.onload=function(){sl('지도 불러오는 중... (도메인: '+location.hostname+')');if(typeof kakao==='undefined'||typeof kakao.maps==='undefined'){sl('❌ 카카오 SDK 미로드<br>appkey 또는 도메인 등록 문제');return;}var t=setTimeout(function(){sl('❌ 지도 초기화 15초 초과<br>도메인: '+location.hostname+'<br>developers.kakao.com → 플랫폼 → Web 확인');},15000);try{kakao.maps.load(function(){clearTimeout(t);map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(36.5,127.8),level:13});map.addControl(new kakao.maps.MapTypeControl(),kakao.maps.ControlPosition.TOPRIGHT);map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);gc=new kakao.maps.services.Geocoder();kakao.maps.event.addListener(map,'click',function(){document.getElementById('cpanel').style.display='none';if(oiw){oiw.close();oiw=null;}});sl('데이터 불러오는 중...');fetch('https://raw.githubusercontent.com/frokyvape-crypto/map-data/main/gc.json').then(function(r){return r.json();}).then(function(data){GC=data;gap();if(!ir){ir=true;kakao.maps.event.addListener(map,'idle',rv);}rv();hl();document.getElementById('stats').textContent='핀 '+ap.length.toLocaleString()+' / 전체 136,573개';}).catch(function(e){sl('❌ 데이터 로드 실패: '+e.message);});});}catch(err){sl('❌ kakao.maps.load 오류: '+err.message);}};function gap(){ap=[];var ks=Object.keys(GC);for(var i=0;i<ks.length;i++){var a=ks[i],v=GC[a];if(!a||a.length<=2||!v||v.length<2)continue;ap.push({a:a,lat:v[0],lng:v[1],cnt:v[2]||1,j:v[3]||'',n:v[4]||''});}}function ca(){for(var i=0;i<am.length;i++)am[i].setMap(null);am=[];for(var i=0;i<ao.length;i++)ao[i].setMap(null);ao=[];}function rv(){if(!map||!ap.length)return;if(rp)return;rp=true;requestAnimationFrame(function(){rp=false;dr();});}function dr(){var lv=map.getLevel(),b=map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast();var minLa=sw.getLat(),maxLa=ne.getLat(),minLo=sw.getLng(),maxLo=ne.getLng();var vis=[];for(var i=0;i<ap.length;i++){var p=ap[i];if(p.lat>=minLa&&p.lat<=maxLa&&p.lng>=minLo&&p.lng<=maxLo)vis.push(p);}ca();if(lv<=7){var lim=800,ts=vis.length>lim?vis.slice(0,lim):vis;for(var i=0;i<ts.length;i++){var m=mk(ts[i].a,ts[i].lat,ts[i].lng,ts[i].cnt,ts[i].j,ts[i].n);m.setMap(map);am.push(m);}}else{rc(vis,lv);}document.getElementById('stats').textContent='핀 '+ap.length.toLocaleString()+' / 전체 136,573개';}function rc(pins,lv){var gs=GS[lv]||0.05,cells={};for(var i=0;i<pins.length;i++){var p=pins[i],gx=Math.floor(p.lng/gs),gy=Math.floor(p.lat/gs),k=gx+","+gy;if(!cells[k])cells[k]={n:0,la:0,lo:0};cells[k].n++;cells[k].la+=p.lat;cells[k].lo+=p.lng;}var ks=Object.keys(cells);for(var i=0;i<ks.length;i++){var c=cells[ks[i]],n=c.n,lat=c.la/n,lng=c.lo/n;var sz=n>1000?50:n>100?40:n>10?32:24;var col=n>1000?"#c0392b":n>100?"#e67e22":n>10?"#f1c40f":"#27ae60";var fs=Math.max(10,Math.round(sz*0.36));var lbl=n>9999?Math.round(n/1000)+"k":n.toLocaleString();var h='<div onclick="ztc('+lat+','+lng+','+lv+')" style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+col+';color:#fff;font-size:'+fs+'px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;border:2px solid rgba(255,255,255,.7);transition:transform .1s" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">'+ lbl +'</div>';var ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(lat,lng),content:h,zIndex:1,yAnchor:0.5,xAnchor:0.5});ov.setMap(map);ao.push(ov);}}function ztc(lat,lng,lv){map.setCenter(new kakao.maps.LatLng(lat,lng));map.setLevel(Math.max(2,lv-3));}function mk(addr,lat,lng,cnt,jibun,name){var m=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng)});kakao.maps.event.addListener(m,'click',function(){if(oiw&&oiw._a===addr){oiw.close();oiw=null;return;}if(oiw)oiw.close();var c='<div style="padding:10px 14px;font-size:13px;min-width:220px;max-width:320px;line-height:1.8;word-break:break-all;background:#fff">';if(name)c+='<div style="font-size:10px;color:#888;margin-bottom:1px">사업자명</div><div style="font-weight:bold;color:#1a252f;margin-bottom:7px">'+name+'</div>';c+='<div style="font-size:10px;color:#888;margin-bottom:1px">도로명주소</div><div style="color:#333">'+addr+'</div>';if(jibun)c+='<div style="margin-top:7px;font-size:10px;color:#888">지번주소</div><div style="color:#555">'+jibun+'</div>';if(cnt>1)c+='<div style="margin-top:7px;font-size:11px;color:#e67e22">이 위치 업소 '+cnt+'개</div>';c+='</div>';var iw=new kakao.maps.InfoWindow({content:c,removable:true,zIndex:500});iw._a=addr;iw.open(map,m);oiw=iw;});return m;}function mv(){var kw=document.getElementById('srch').value.trim();if(!kw||!map){return;}document.getElementById('cpanel').style.display='none';var rs=[],done=0;function ts(){if(++done<2)return;var seen={},uniq=rs.filter(function(r){var k=r.lat.toFixed(4)+','+r.lng.toFixed(4);return seen[k]?false:(seen[k]=true);});if(!uniq.length){alert('주소를 찾을 수 없습니다.');return;}if(uniq.length===1)gt(uniq[0]);else sc(kw,uniq);}if(gc){gc.addressSearch(kw,function(res,st){if(st===kakao.maps.services.Status.OK)res.slice(0,5).forEach(function(r){rs.push({name:r.address_name,lat:parseFloat(r.y),lng:parseFloat(r.x)});});ts();});}else{done++;}try{new kakao.maps.services.Places().keywordSearch(kw,function(data,st){if(st===kakao.maps.services.Status.OK)data.slice(0,5).forEach(function(r){rs.push({name:r.place_name,addr:r.road_address_name||r.address_name,lat:parseFloat(r.y),lng:parseFloat(r.x)});});ts();});}catch(e){done++;ts();}}function gt(r){var pos=new kakao.maps.LatLng(r.lat,r.lng);map.setCenter(pos);map.setLevel(3);var pin='<div style="position:relative;width:28px;height:40px"><div style="width:28px;height:28px;background:#e74c3c;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div><div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:4px;height:12px;background:#e74c3c;border-radius:0 0 2px 2px"></div></div>';var lbl='<div style="padding:5px 10px;background:#fff;border:2px solid #e74c3c;border-radius:6px;font-size:12px;font-weight:bold;color:#c0392b;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+(r.name||kw)+'</div>';var ov=new kakao.maps.CustomOverlay({position:pos,content:pin,yAnchor:1,xAnchor:0.5,zIndex:10});ov.setMap(map);var lo=new kakao.maps.CustomOverlay({position:pos,content:lbl,yAnchor:2.4,xAnchor:0.5,zIndex:11});lo.setMap(map);setTimeout(function(){ov.setMap(null);lo.setMap(null);},5000);}function sc(kw,list){document.getElementById('ctitle').textContent='"'+kw+'" 검색 결과';var el=document.getElementById('clist');el.innerHTML='';list.forEach(function(r){var d=document.createElement('div');d.className='ci';d.innerHTML='<div class="cn">'+(r.name||r.addr||'')+'</div>'+(r.addr&&r.addr!==r.name?'<div class="ca">'+r.addr+'</div>':'');d.onclick=function(){document.getElementById('cpanel').style.display='none';gt(r);};el.appendChild(d);});document.getElementById('cpanel').style.display='flex';}</script></body></html>
